
<!-- ROBO INVENTOR NOTIFICATION UPGRADE START -->

<style>
#ri-news-bell {
  position: fixed;
  bottom: 24px;
  right: 20px;
  width: 60px;
  height: 60px;
  border: 1px solid #62caff;
  border-radius: 50%;
  background: #006aff;
  color: white;
  font-size: 28px;
  cursor: pointer;
  z-index: 9998;
  box-shadow: 0 0 22px #008cff99;
}

#ri-news-dot {
  position: absolute;
  top: 7px;
  right: 7px;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #ff354f;
  border: 2px solid white;
}

#ri-news-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0, 0, 0, 0.8);
  padding: 20px;
  align-items: center;
  justify-content: center;
}

#ri-news-popup {
  width: 100%;
  max-width: 400px;
  padding: 28px;
  border: 1px solid #00aaff;
  border-radius: 20px;
  background: #0b1730;
  color: white;
  text-align: center;
  font-family: Arial, sans-serif;
  box-shadow: 0 0 35px #007bff66;
}

#ri-news-popup h2 {
  color: #59c5ff;
  margin-top: 0;
}

#ri-news-popup p {
  line-height: 1.6;
}

#ri-news-close {
  background: #007bff;
  color: white;
  border: none;
  padding: 12px 28px;
  border-radius: 10px;
  font-size: 15px;
  cursor: pointer;
}
</style>

<button id="ri-news-bell" type="button"
        aria-label="View website updates">
  &#128276;
  <span id="ri-news-dot"></span>
</button>

<div id="ri-news-overlay">
  <div id="ri-news-popup"
       role="dialog"
       aria-modal="true"
       aria-labelledby="ri-news-title">

    <h2 id="ri-news-title">What's New!</h2>

    <p id="ri-news-message"></p>

    <button id="ri-news-close" type="button">
      Got it!
    </button>
  </div>
</div>

<script>
(function () {
  // CHANGE THESE WHEN YOU PUBLISH SOMETHING NEW
  const updateVersion = "1";
  const updateMessage =
    "Welcome to ROBO INVENTOR! Explore our latest robotics projects, Arduino tutorials and 3D printing creations.";

  const bell = document.getElementById("ri-news-bell");
  const dot = document.getElementById("ri-news-dot");
  const overlay = document.getElementById("ri-news-overlay");
  const message = document.getElementById("ri-news-message");
  const closeButton = document.getElementById("ri-news-close");
  const storageKey = "roboInventorLastSeenNews";

  message.textContent = updateMessage;

  function seenVersion() {
    try {
      return localStorage.getItem(storageKey);
    } catch (error) {
      return null;
    }
  }

  function openPopup() {
    overlay.style.display = "flex";
    closeButton.focus();
  }

  function closePopup() {
    overlay.style.display = "none";
    dot.style.display = "none";

    try {
      localStorage.setItem(storageKey, updateVersion);
    } catch (error) {}

    bell.focus();
  }

  bell.addEventListener("click", openPopup);
  closeButton.addEventListener("click", closePopup);

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" &&
        overlay.style.display === "flex") {
      closePopup();
    }
  });

  if (seenVersion() === updateVersion) {
    dot.style.display = "none";
  } else {
    openPopup();
  }
})();
</script>

<!-- ROBO INVENTOR NOTIFICATION UPGRADE END -->
